
version: 2

models:
  - name: int_xauusd_candle_metrics
    description: "Reusable analytical metrics calculated from XAU/USD 30-minute candles."

    columns:
      - name: candle_timestamp
        data_tests:
          - not_null
          - unique

      - name: candle_direction
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['bullish', 'bearish', 'neutral']

      - name: candle_range
        data_tests:
          - not_null

      - name: upper_wick
        data_tests:
          - not_null

      - name: lower_wick
        data_tests:
          - not_null
